<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puzzle</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FRAME — only seam fix added */
.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;

    isolation:isolate;
}

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter: brightness(0.72) contrast(1.08);

    transform: translateZ(0);
}

/* invisible overlay to kill edge artifact */
.frame::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    box-shadow: inset 0 0 0 1px #000;
}

/* CHOICES */

.choices{
    position:absolute;
    left:4.5%;
    bottom:15%;
    display:flex;
    flex-direction:column;
    gap:28px;
    color:#fff;
    font-family:Arial,sans-serif;
    z-index:2;
}

.choice{
    display:flex;
    align-items:center;
}

.letter{
    font-size:30px;
    font-weight:300;
    margin-right:12px;
}

.answer{
    font-size:30px;
    font-weight:700;
    letter-spacing:1px;
}

</style>

</head>

<body>

<div class="frame">

    <img src="images/IMG_0003.JPG">

    <div class="choices">

        <div class="choice">
            <span class="letter">A.</span>
            <span class="answer">THUNDER</span>
        </div>

        <div class="choice">
            <span class="letter">B.</span>
            <span class="answer">SOUND</span>
        </div>

        <div class="choice">
            <span class="letter">C.</span>
            <span class="answer">ECHO</span>
        </div>

    </div>

</div>

</body>
</html>
