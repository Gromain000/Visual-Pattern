<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sequence Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

.sequence-box{
  
position:absolute;

top:18%;
left:50%;

transform:translateX(-50%);

width:65%;
height:30%;

background:#3e3e3e;

border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

overflow:hidden;

z-index:999;
}

.sequence-text{

position:absolute;
  
width:90%;

color:white;

font-size:15px;

top:20px;  
  
font-weight:100;
  
white-space:nowrap;

overflow:hidden;

text-overflow:clip;

line-height:1.3;

font-family:Arial,sans-serif;  

text-align: left;  

align-items:center;
  
}

@media (max-width:768px){

.sequence-box{

top:17%;
width:65%;
height:30%;

}

.sequence-text{

font-size:9px;
top:10px;
} 

}
  
.line{
display:block;
}

/* CHOICE TEXT */
  
.choice-text{
position:absolute;

left:17.5%;
top:48%;

display:flex;
flex-direction:column;

gap:4px;

z-index: 100;

color:white;

font-family:Arial,sans-serif;
}

.choice-line{
display:flex;
align-items:center;
}

.choice-letter{
font-size:18px;
font-weight: 200;
margin-right:10px;
}

.choice-answer{
font-size:18px;
font-weight: 1000;
}
 
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:black;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:flex-start;

padding-top:55px;
}

/* GOOGLE TRANSLATE */
#google_translate_element{
position:fixed;
top:10px;
right:10px;
z-index:999999;
}

.goog-te-gadget{
font-size:12px !important;
}

.goog-te-gadget span{
display:none;
}

.goog-te-combo{
background:#111;
color:#fff;
border:1px solid #333;
padding:6px;
border-radius:6px;
}

/* FRAME */

.frame{
position:relative;
width:min(88vw,88vh);
aspect-ratio:1/1;
}

/* IMAGE */

.frame img{
width:100%;
height:100%;
object-fit:contain;
display:block;
filter:brightness(0.72) contrast(1.08);
pointer-events:none;
}

/* CHOICES INBOXES */

.choice-a,
.choice-b,
.choice-c {
  position: absolute;

  left: 14%;
  width: 28%;
  height: 6%;

  display: flex;
  align-items: center;
  justify-content: flex-start;
  text-align: left;
  padding-left:15px;
  gap: 8px;

  color: white;
  text-decoration: none;
  font-family: Arial, sans-serif;

  border-radius: 12px;

  cursor: pointer;

  box-sizing: border-box;

  overflow: hidden;
 
  transition: 
  transform 0.08s ease,
  background 0.15s ease,
  box-shadow 0.15s ease;
}

/* CHOICES INBOXES MOBILE */
  
@media (max-width: 768px){

.choice-a,
.choice-b,
.choice-c{
position:absolute;
padding-left:5.5px; 
}
  
}  

/* INBOX HOVER EFFECT */

.choice-a:hover,
.choice-b:hover,
.choice-c:hover{

background:rgba(255,255,255,0.05);

box-shadow:
0 0 12px rgba(255,255,255,0.18);

}

/* INBOX TAP EFFECT */

.choice-a:active,
.choice-b:active,
.choice-c:active{

transform:scale(0.95);

background:rgba(255,255,255,0.12);

}

/* CHOICE INBOX Setting */

.choice-a{
position:absolute;
left:17.5%;
top:53%;
}

.choice-b{
position:absolute;
left:17.5%;
top:60%;
}

.choice-c{
position:absolute;
left:17.5%;
top:67%;
}

/* CHOICE Setting MOBILE */

@media (max-width: 768px){

.choice-a{
left:15.5%;
top:55.5%;
}

.choice-b{
left:15.5%;
top:62.5%;
}

.choice-c{
left:15.5%;
top:69.5%;
}

}
 
/* LIGHTBULB */

.lightbulb-hitbox{

position:absolute;

/* CHANGE THESE IF NEEDED */

top:0%;
right:14%;

width:12%;
height:12%;

z-index:9999;

cursor:pointer;

border-radius:50%;
}

/* POPUP */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.82);

display:flex;

justify-content:center;
align-items:center;

opacity:0;
pointer-events:none;

transition:0.25s;

z-index:999999;
}

.popup-overlay.active{
opacity:1;
pointer-events:auto;
}

/* POP-UP BOX */

.popup-box{

position:relative;

width:min(78vw,520px);

aspect-ratio:1/1;

background:black;

border:8px solid white;

border-radius:28px;

display:flex;

flex-direction:column;

align-items:center;

padding-top:30px;

}

/* POP-UP SIDE LINE */

.popup-box::after{

content:"";

position:absolute;

right:-12px;
top:-14px;

width:2px;
height:108%;

background:white;
}

/* POP-UP TITLE */

.popup-title{

color:white;

font-family:'UnifrakturCook', cursive;

font-size:clamp(42px,5vw,62px);

margin-bottom:55px;
}

/* POP-UP TEXT */

.popup-text{

width:80%;

text-align:center;

color:white;

font-family:'Special Elite', monospace;

font-size:clamp(16px,2vw,26px);

line-height:1.5;
}

</style>

</head>

<body>

<!-- GOOGLE TRANSLATE -->
<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="frame">

<img src="images/IMG_0003.JPG">

<div class="sequence-box">
  <div class="sequence-text">
    <div class="line">I SPEAK WITHOUT A MOUTH,</div>
    <div class="line">I HEAR WITHOUT EARS,</div>
    <div class="line">I HAVE NO BODY BUT I COME</div>
    <div class="line">ALIVE WITH THE WIND</div>
    <div style="height:20px;"></div>
    <div class="line">WHAT AM I ?</div>
  </div>

</div>
<!-- BULB CLICK -->

<div
class="lightbulb-hitbox"
id="bulb">
</div>

<!-- CHOICES -->

<a class="choice-a" href="https://gromain000.github.io/Gromain/">

<span class="choice-letter">1.</span>
<span class="choice-answer">THUNDER</span>
 
</a>

<a class="choice-b" href="https://gromain000.github.io/Gromain/">

 <span class="choice-letter">2.</span>
 <span class="choice-answer">SOUND</span>
 
</a>

<a class="choice-c" href="Q4.html">

<span class="choice-letter">3.</span>
<span class="choice-answer">ECHO</span>
 
</a>

</div>
  
</div>

<!-- POPUP -->

<div
class="popup-overlay"
id="popup">

<div
class="popup-box"
id="popupBox">

<div class="popup-title">
Clue
</div>

<div class="popup-text">
The socond voice is born only after the first is cast into the void 
</div>

</div>

</div>

<script>

const bulb =
document.getElementById("bulb");

const popup =
document.getElementById("popup");

const popupBox =
document.getElementById("popupBox");

/* OPEN */

bulb.onclick = function(){

popup.classList.add("active");

};

/* CLOSE OUTSIDE */

popup.onclick = function(e){

if(!popupBox.contains(e.target)){

popup.classList.remove("active");

}

};

</script>

</body>
</html>
