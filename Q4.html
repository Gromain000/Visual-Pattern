<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

.quiz-area{
transform:translatey(-220px) scale(0.45);
transform-origin:top center;

display:flex;
flex-direction:column;
align-items:center; 
position:relative;
left:35px;    
}
    
.line{
display:block;
}

.answerRow{
    margin-top:180px;
    display:flex;
    justify-content:center;
    gap:15px;
    align-items:center;
    width:100%;
    transform:translatex(47px);
}

.answerBox{
    width:320px;
    height:70px;
    background:white;
    border-radius:15px;
    color:black;
    font-size:40px;
    text-align:center;
    border:none;
    outline:none;
    display:bock;
}

.delete{
    width:80px;
    height:80px;
    background:#af7385;
    border:3px solid white;
    border-radius:20px;
    color:white;
    font-size:65px;
    cursor:pointer;
}

.keypad{
    margin-top:35px;
    display:grid;
    grid-template-columns:repeat(3,65px);
    gap:15px;
    justify-content:center;
}

.key{
    width:65px;
    height:65px;
    font-size:45px;
    border:none;
    border-radius:20px;
    background:#eee;
    cursor:pointer;
}

.zero{
    grid-column:2 / 3;
}

.submit{
    margin-top:80px;
    width:270px;
    height:60px;
    border:none;
    border-radius:30px;
    background:#95c93d;
    cursor:pointer;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:black;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:flex-start;
padding-top:55px;
}

/* GOOGLE TRANSLATE */

#google_translate_element{
position:fixed;
top:10px;
right:10px;
z-index:999999;
}

.goog-te-gadget{
font-size:12px !important;
}

.goog-te-gadget span{
display:none;
}

.goog-te-combo{
background:#111;
color:#fff;
border:1px solid #333;
padding:6px;
border-radius:6px;
}

/* FRAME */

.frame{
position:relative;
width:min(88vw,88vh);
aspect-ratio:1/1;
}

/* IMAGE */

.frame img{
width:100%;
height:100%;
object-fit:contain;
display:block;
filter:brightness(0.72) contrast(1.08);
pointer-events:none;
}

/* QUESTION TEXT */

.question-text{
position:absolute;

top:7%;
left:50%;

transform:translateX(-50%);
width:99%;
text-align:center;

color:white;
font-size:clamp(10px,2vw,14px);
font-family:Arial;
letter-spacing:2px;

background:black;
padding:8px 14px;
border-radius:8px;

z-index:100;
align-items:left;    
}

/* LIGHTBULB */

.lightbulb-hitbox{
position:absolute;
top:0%;
right:14%;
width:12%;
height:12%;
z-index:9999;
cursor:pointer;
border-radius:50%;
}

/* POPUP */

.popup-overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.82);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
pointer-events:none;
transition:0.25s;
z-index:999999;
}

.popup-overlay.active{
opacity:1;
pointer-events:auto;
}

/* POPUP BOX */

.popup-box{
position:relative;
width:min(78vw,520px);
aspect-ratio:1/1;
background:black;
border:8px solid white;
border-radius:28px;
display:flex;
flex-direction:column;
align-items:center;
padding-top:30px;
}

/* SIDE LINE */

.popup-box::after{
content:"";
position:absolute;
right:-12px;
top:-14px;
width:2px;
height:108%;
background:white;
}

/* TITLE */

.popup-title{
color:white;
font-family:'UnifrakturCook', cursive;
font-size:clamp(42px,5vw,62px);
margin-bottom:55px;
}

/* TEXT */

.popup-text{
width:80%;
text-align:center;
color:white;
font-family:'Special Elite', monospace;
font-size:clamp(16px,2vw,26px);
line-height:1.5;
}

</style>

</head>

<body>

<!-- GOOGLE TRANSLATE -->

<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="frame">

<img src="images/IMG_0004.JPG">

<div class="question-text">
<div class="line">John is 10, his brother is half his age</div>
<div style="height:10px;"></div>
<div class="line">If John is 30 years old, how old is John's brother</div>
</div>

<div class="quiz-area">
 <div class="answerRow">
 <input class="answerBox" id="answer" readonly>
 <button class="delete" onclick="erase()">X</button>
 </div>

 <div class="keypad">
 <button class="key" onclick="addNumber(1)">1</button>
 <button class="key" onclick="addNumber(2)">2</button>
 <button class="key" onclick="addNumber(3)">3</button>

 <button class="key" onclick="addNumber(4)">4</button>
 <button class="key" onclick="addNumber(5)">5</button>
 <button class="key" onclick="addNumber(6)">6</button>

 <button class="key" onclick="addNumber(7)">7</button>
 <button class="key" onclick="addNumber(8)">8</button>
 <button class="key" onclick="addNumber(9)">9</button>

 <button class="key zero" onclick="addNumber(0)">0</button>
 </div>

 <button class="submit" onclick="checkAnswer()"></button>

<!-- BULB CLICK -->

<div
class="lightbulb-hitbox"
id="bulb">
</div>

</div>

<!-- POPUP -->

<div
class="popup-overlay"
id="popup">

<div
class="popup-box"
id="popupBox">

<div class="popup-title">
Clue
</div>

<div class="popup-text">
Each step beareth a weight greater than that which comes before it
</div>

</div>

</div>

<script>

function addNumber(num){
    document.getElementById("answer").value += num;
}

function erase(){
    let box = document.getElementById("answer");
    box.value = box.value.slice(0,-1);
}

function checkAnswer(){
    let answer = document.getElementById("answer").value;

    if(answer === "25"){
        alert("Correct!");
        // window.location.href = "nextpage.html";
    }
    else{
        alert("Wrong answer.");
    }
}

const bulb =
document.getElementById("bulb");

const popup =
document.getElementById("popup");

const popupBox =
document.getElementById("popupBox");

/* OPEN */

bulb.onclick = function(){

popup.classList.add("active");

};

/* CLOSE OUTSIDE */

popup.onclick = function(e){

if(!popupBox.contains(e.target)){

popup.classList.remove("active");

}

};

</script>

</body>
</html>
