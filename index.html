<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Sequence Quiz</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GOOGLE TRANSLATE */

#google_translate_element{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
}

.goog-te-gadget{
    font-size:12px !important;
}

.goog-te-gadget span{
    display:none;
}

.goog-te-combo{
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:6px;
    border-radius:6px;
    outline:none;
}

/* FRAME */

.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* IMAGE */

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter:brightness(0.72) contrast(1.08);
}

/* TRANSLATABLE QUESTION */

.question-text{
    position:absolute;

    top:16%;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    color:white;

    Font-size:clamp(15px, 2.1vw, 22px);

    font-family:Arial, sans-serif;

    font-weight:300;

    letter-spacing:2px;

    z-index:200;

    /* hides original image text behind */
    background:black;

    padding:8px 14px;

    border-radius:8px;
}

/* CLICKABLE AREAS */

.choice-a,
.choice-b,
.choice-c{
    position:absolute;

    width:28%;
    height:6%;

    z-index:100;

    cursor:pointer;

    border-radius:12px;

    transition:
    transform 0.08s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}

/* HOVER EFFECT */

.choice-a:hover,
.choice-b:hover,
.choice-c:hover{
    background:rgba(255,255,255,0.05);

    box-shadow:
    0 0 12px rgba(255,255,255,0.18);
}

/* TAP EFFECT */

.choice-a:active,
.choice-b:active,
.choice-c:active{
    transform:scale(0.95);

    background:rgba(255,255,255,0.12);
}

/* POSITIONS */

.choice-a{
    left:2%;
    top:48%;
}

.choice-b{
    left:2%;
    top:54%;
}

.choice-c{
    left:2%;
    top:60%;
}

</style>
</head>

<body>

<!-- GOOGLE TRANSLATE -->

<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- FRAME -->

<div class="frame">

<img
src="https://customer-assets.emergentagent.com/job_5cac3d2d-7b84-4ac9-84b9-84696dbf672e/artifacts/jlifadde_image.jpeg"
alt="Sequence Quiz"
/>

<!-- TRANSLATABLE TEXT -->

<div class="question-text">
WHAT COMES NEXT IN SEQUENCE
</div>

<!-- CLICKABLE AREAS -->

<a
class="choice-a"
href="https://gromain000.github.io/Gromain/">
</a>

<a
class="choice-b"
href="https://gromain000.github.io/Gromain/">
</a>

<a
class="choice-c"
href="#">
</a>

</div>

</body>
</html>
