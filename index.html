<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sequence Quiz</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GOOGLE TRANSLATE POSITION */
#google_translate_element{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
}

/* keep default Google styling small */
.goog-te-gadget{
    font-size:12px !important;
}

.goog-te-gadget span{
    display:none;
}

.goog-te-combo{
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:6px;
    border-radius:6px;
}

.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;
}

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter:brightness(0.72) contrast(1.08);
}

/* CLICKABLE AREAS */

.choice-a,
.choice-b,
.choice-c{
    position:absolute;

    width:28%;
    height:6%;

    z-index:100;

    cursor:pointer;

    border-radius:12px;

    transition:
    transform 0.08s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}

.choice-a:hover,
.choice-b:hover,
.choice-c:hover{
    background:rgba(255,255,255,0.05);

    box-shadow:
    0 0 12px rgba(255,255,255,0.18);
}

.choice-a:active,
.choice-b:active,
.choice-c:active{
    transform:scale(0.95);

    background:rgba(255,255,255,0.12);
}

/* POSITIONS */

.choice-a{
    left:2%;
    top:48%;
}

.choice-b{
    left:2%;
    top:54%;
}

.choice-c{
    left:2%;
    top:60%;
}

</style>
</head>

<body>

<!-- GOOGLE TRANSLATE -->
<div id="google_translate_element"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      includedLanguages: 'en,fr,es,de,it,pt,nl,ru,ar,zh-CN,ja,ko',
      layout: google.translate.TranslateElement.InlineLayout.SIMPLE
    },
    'google_translate_element'
  );
}
</script>

<script type="text/javascript"
src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

<div class="frame">

<img
src="https://customer-assets.emergentagent.com/job_5cac3d2d-7b84-4ac9-84b9-84696dbf672e/artifacts/jlifadde_image.jpeg"
alt="Sequence Quiz"
/>

<a class="choice-a" href="https://gromain000.github.io/Gromain/"></a>
<a class="choice-b" href="https://gromain000.github.io/Gromain/"></a>
<a class="choice-c" href="#"></a>

</div>

</body>
</html>
