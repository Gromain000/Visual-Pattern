<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sequence Quiz</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:#000000;
}

.frame img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    user-select:none;
    -webkit-user-drag:none;

    /* THIS DARKENS THE IMAGE BLACK */
    filter:brightness(0.72) contrast(1.08);
}

</style>
</head>

<body>

<div class="frame">

<img
src="https://customer-assets.emergentagent.com/job_5cac3d2d-7b84-4ac9-84b9-84696dbf672e/artifacts/jlifadde_image.jpeg"
alt="Sequence Quiz"
/>

</div>

</body>
</html>
