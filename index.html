<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sequence Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background-color: #000;        /* matches the image background → no visible borders */
  }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }

  .frame {
    /* Always a perfect square, sized to the smaller side of the viewport */
    width: min(96vw, 96vh);
    aspect-ratio: 1 / 1;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;   /* preserves the image exactly — no crop, no distortion */
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
</style>
</head>
<body>
  <div class="frame">
    <img
      src="https://customer-assets.emergentagent.com/job_5cac3d2d-7b84-4ac9-84b9-84696dbf672e/artifacts/jlifadde_image.jpeg"
      alt="What comes next in sequence: A, C, F, J, O, _ — A. P  B. Q  C. U"
    />
  </div>
</body>
