   <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find The Next Number</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FRAME */
.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;

    isolation:isolate;
}

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter: brightness(0.72) contrast(1.08);

    transform: translateZ(0);
}

/* FIX EDGE ARTIFACT */
.frame::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    box-shadow: inset 0 0 0 1px #000;
}

/* CLICKABLE AREAS */

.choice-a,
.choice-b,
.choice-c{
    position:absolute;

    width:28%;
    height:6%;

    z-index:100;

    cursor:pointer;

    border-radius:12px;

    transition:
    transform 0.08s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}

/* HOVER EFFECT */

.choice-a:hover,
.choice-b:hover,
.choice-c:hover{
    background:rgba(255,255,255,0.05);

    box-shadow:
    0 0 12px rgba(255,255,255,0.18);
}

/* CLICK EFFECT */

.choice-a:active,
.choice-b:active,
.choice-c:active{
    transform:scale(0.95);

    background:rgba(255,255,255,0.12);
}

/* POSITIONS */

.choice-a{
    left:2%;
    top:48%;
}

.choice-b{
    left:2%;
    top:54%;
}

.choice-c{
    left:2%;
    top:60%;
}

/* TRANSLATOR */

#google_translate_element{
    position:absolute;
    top:2%;
    left:2%;

    z-index:9999;

    background:rgba(0,0,0,0.65);

    padding:6px 10px;

    border-radius:10px;

    backdrop-filter:blur(4px);
}

.goog-te-gadget{
    font-size:0 !important;
}

.goog-te-gadget select{
    background:#111;
    color:#fff;

    border:1px solid #333;

    padding:6px 10px;

    border-radius:8px;

    outline:none;

    cursor:pointer;
}

</style>

</head>

<body>

<div class="frame">

    <!-- TRANSLATOR -->
    <div id="google_translate_element"></div>

    <!-- IMAGE -->
    <img src="IMG_3007.JPG" alt="Find the next number puzzle">

    <!-- A.77 -->
    <a
    class="choice-a"
    href="https://gromain000.github.io/Gromain/">
    </a>

    <!-- B.67 -->
    <a
    class="choice-b"
    href="#">
    </a>

    <!-- C.198 -->
    <a
    class="choice-c"
    href="https://gromain000.github.io/Gromain/">
    </a>

</div>

<script>

function googleTranslateElementInit(){
    new google.translate.TranslateElement(
    {
        pageLanguage:'en'
    },
    'google_translate_element'
    );
}

</script>

<script
src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

</body>
</html>
