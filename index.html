<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question</title>

<style>

body{
    margin:0;
    background:black;
    overflow:hidden;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
}

img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

/* CLICK AREAS */

.zone{
    position:absolute;
    cursor:pointer;
}

/* A */
.a{
    left:4%;
    top:52%;
    width:20%;
    height:8%;
}

/* B */
.b{
    left:4%;
    top:61%;
    width:20%;
    height:8%;
}

/* C */
.c{
    left:4%;
    top:70%;
    width:20%;
    height:8%;
}

</style>

</head>

<body>

<div class="container">

<img src="question.jpg">

<div class="zone a" onclick="alert('You clicked A')"></div>

<div class="zone b" onclick="alert('Correct Answer')"></div>

<div class="zone c" onclick="alert('You clicked C')"></div>

</div>

</body>
</html>
