<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Sequence Quiz</title>

<!-- FONTS -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* GOOGLE TRANSLATE */

#google_translate_element{
    position:fixed;
    top:10px;
    right:10px;
    z-index:9999;
}

.goog-te-gadget{
    font-size:12px !important;
}

.goog-te-gadget span{
    display:none;
}

.goog-te-combo{
    background:#111;
    color:#fff;
    border:1px solid #333;
    padding:6px;
    border-radius:6px;
    outline:none;
}

/* FRAME */

.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;
}

/* IMAGE */

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter:brightness(0.72) contrast(1.08);
}

/* QUESTION */

.question-text{
    position:absolute;

    top:16%;
    left:50%;

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    color:white;

    font-size:clamp(15px, 2.1vw, 20px);

    font-family:Arial, sans-serif;

    font-weight:300;

    letter-spacing:2px;

    z-index:200;

    background:black;

    padding:8px 14px;

    border-radius:8px;
}

/* ANSWER AREAS */

.choice-a,
.choice-b,
.choice-c{
    position:absolute;

    width:28%;
    height:6%;

    z-index:100;

    cursor:pointer;

    border-radius:12px;

    transition:
    transform 0.08s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}

.choice-a:hover,
.choice-b:hover,
.choice-c:hover{
    background:rgba(255,255,255,0.05);

    box-shadow:
    0 0 12px rgba(255,255,255,0.18);
}

.choice-a:active,
.choice-b:active,
.choice-c:active{
    transform:scale(0.95);

    background:rgba(255,255,255,0.12);
}

.choice-a{
    left:2%;
    top:48%;
}

.choice-b{
    left:2%;
    top:54%;
}

.choice-c{
    left:2%;
    top:60%;
}

/* LIGHTBULB CLICK AREA */

.lightbulb-hitbox{
    position:absolute;

    top:1.5%;
    right:1.5%;

    width:10%;
    height:10%;

    z-index:300;

    cursor:pointer;

    border-radius:50%;
}

/* POPUP OVERLAY */

.popup-overlay{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.72);

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;
    visibility:hidden;

    transition:
    opacity 0.25s ease,
    visibility 0.25s ease;

    z-index:99999;

    backdrop-filter:blur(2px);
}

/* SHOW POPUP */

.popup-overlay.active{
    opacity:1;
    visibility:visible;
}

/* POPUP BOX */

.popup-box{
    position:relative;

    width:min(70vw, 520px);

    aspect-ratio:1/1;

    background:black;

    border:8px solid white;

    border-radius:28px;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:28px;

    box-shadow:
    0 0 18px rgba(255,255,255,0.12);

    animation:popupAppear 0.25s ease;
}

/* RIGHT SIDE LINE */

.popup-box::after{
    content:"";

    position:absolute;

    top:-18px;
    right:-14px;

    width:2px;
    height:110%;

    background:white;

    opacity:0.85;
}

/* TITLE */

.popup-title{
    color:white;

    font-family:'UnifrakturCook', cursive;

    font-size:clamp(38px,5vw,60px);

    margin-bottom:60px;

    text-shadow:
    0 0 3px rgba(255,255,255,0.15);
}

/* CLUE TEXT */

.popup-text{
    width:78%;

    color:white;

    text-align:center;

    font-family:'Special Elite', monospace;

    font-size:clamp(17px,2vw,28px);

    line-height:1.5;

    letter-spacing:1px;

    text-shadow:
    0 0 2px rgba(255,255,255,0.08);
}

/* ANIMATION */

@keyframes popupAppear{
    from{
        transform:scale(0.92);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

/* MOBILE */

@media (max-width:700px){

.popup-box{
    width:78vw;

    border-width:6px;

    border-radius:22px;

    padding-top:20px;
}

.popup-title{
    margin-bottom:45px;
}

.popup-text{
    width:82%;

    font-size:clamp(15px,4vw,22px);
}

}

</style>
</head>

<body>

<!-- GOOGLE TRANSLATE -->

<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- FRAME -->

<div class="frame">

<img
src="https://customer-assets.emergentagent.com/job_5cac3d2d-7b84-4ac9-84b9-84696dbf672e/artifacts/jlifadde_image.jpeg"
alt="Sequence Quiz"
/>

<!-- QUESTION -->

<div class="question-text">
WHAT COMES NEXT IN SEQUENCE
</div>

<!-- LIGHTBULB CLICK -->

<div class="lightbulb-hitbox" id="openClue"></div>

<!-- ANSWERS -->

<a
class="choice-a"
href="https://gromain000.github.io/Gromain/">
</a>

<a
class="choice-b"
href="https://gromain000.github.io/Gromain/">
</a>

<a
class="choice-c"
href="#">
</a>

</div>

<!-- POPUP -->

<div class="popup-overlay" id="popupOverlay">

    <div class="popup-box" id="popupBox">

        <div class="popup-title">
            Clue
        </div>

        <div class="popup-text">
            Each step beareth a weight greater than that which comes before it
        </div>

    </div>

</div>

<script>

/* OPEN POPUP */

const openClue =
document.getElementById("openClue");

const popupOverlay =
document.getElementById("popupOverlay");

const popupBox =
document.getElementById("popupBox");

openClue.addEventListener("click", () => {
    popupOverlay.classList.add("active");
});

/* CLOSE WHEN CLICKING OUTSIDE */

popupOverlay.addEventListener("click", (e) => {

    if(!popupBox.contains(e.target)){

        popupOverlay.classList.remove("active");

    }

});

/* PREVENT INSIDE CLICK CLOSE */

popupBox.addEventListener("click", (e) => {

    e.stopPropagation();

});

</script>

</body>
</html>
