<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find The Next Number</title>

<style>

.cube-link {
  text-decoration: none;
}



.cube:hover {
  transform: scale(1.05);
}
    
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html, body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* FRAME — only seam fix added */
.frame{
    width:min(96vw,96vh);
    aspect-ratio:1/1;
    position:relative;
    overflow:hidden;
    background:#000;

    /* 🔥 fixes 1px seam without affecting image */
    isolation:isolate;
}

.frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;

    user-select:none;
    -webkit-user-drag:none;

    filter: brightness(0.72) contrast(1.08);

    /* 🔥 prevents rendering gaps */
    transform: translateZ(0);
}

/* 🔥 invisible overlay to kill edge artifact */
.frame::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    box-shadow: inset 0 0 0 1px #000;
}

</style>

</head>

<body>

<div class="frame">
    <img src="images/IMG_5.jpeg">
</div>

</body>
</html>
