<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personal Quiz</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

<style>

/* LEGIBLE CHOICE BUTTONS */

.choice-a,
.choice-b{

position:absolute;

width:160px;
height:220px;

background:#5b5b5b;

border:4px solid #bdbdbd;

border-radius:12px;

text-decoration:none;

display:flex;

flex-direction:column;

align-items:center;

justify-content:flex-start;

padding:18px;

overflow:hidden; 

transition:.2s;

color:white;

}

.choice-a{

left:7%;
top:44%;

}

.choice-b{

left:55%;
top:44%;

}

.choice-a:hover,
.choice-b:hover{

transform:scale(1.05);

border-color:white;

}

.choice-title{

font-size:23px;

margin-top:5px; 

margin-bottom:13px;

font-weight:300;

text-align:center;

font-family: Arial, sans-serif; 

color:black; 

}

.choice-body{

font-size:13px;

line-height:1.3;

text-align:left;

color:black; 

}

.choice-footer{

margin-top:auto;

text-align:left;

font-size:13px;
 
}

.somewhat{
font-style:italic;

text-align:left;
 
} 

.choice-footer strong{

text-decoration:underline;

text-align:left;

font-style:normal; 
 
}

.line{
display:block;
} 
 
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
background:black;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:flex-start;

padding-top:120px;
}

/* GOOGLE TRANSLATE */
#google_translate_element{
position:fixed;
top:10px;
right:10px;
z-index:999999;
}

.goog-te-gadget{
font-size:12px !important;
}

.goog-te-gadget span{
display:none;
}

.goog-te-combo{
background:#111;
color:#fff;
border:1px solid #333;
padding:6px;
border-radius:6px;
}

/* FRAME */

.frame{
position:relative;
width:min(88vw,88vh);
aspect-ratio:1/1;
}

/* IMAGE */

.frame img{
width:100%;
height:100%;
object-fit:contain;
display:block;
filter:brightness(0.72) contrast(1.08);
pointer-events:none;
}

/* QUESTION Text */

.question-text{
position:absolute;

top:14%;
left:50%;

transform:translateX(-50%);

width:99%;

text-align:center;

color:white;

font-size:clamp(13px,2vw,20px);

font-family:Arial;

letter-spacing:2px;

background:black;

padding:8px 14px;

border-radius:8px;

z-index:100;
}


 
/* LIGHTBULB */

.lightbulb-hitbox{

position:absolute;

/* CHANGE THESE IF NEEDED */

top:0%;
right:14%;

width:12%;
height:12%;

z-index:9999;

cursor:pointer;

border-radius:50%;
}

/* POPUP */

.popup-overlay{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,0.82);

display:flex;

justify-content:center;
align-items:center;

opacity:0;
pointer-events:none;

transition:0.25s;

z-index:999999;
}

.popup-overlay.active{
opacity:1;
pointer-events:auto;
}

/* POP-UP BOX */

.popup-box{

position:relative;

width:min(78vw,520px);

aspect-ratio:1/1;

background:black;

border:8px solid white;

border-radius:28px;

display:flex;

flex-direction:column;

align-items:center;

padding-top:30px;

}

/* POP-UP SIDE LINE */

.popup-box::after{

content:"";

position:absolute;

right:-12px;
top:-14px;

width:2px;
height:108%;

background:white;
}

/* POP-UP TITLE */

.popup-title{

color:white;

font-family:'UnifrakturCook', cursive;

font-size:clamp(42px,5vw,62px);

margin-bottom:55px;
}

/* POP-UP TEXT */

.popup-text{

width:80%;

text-align:center;

color:white;

font-family:'Special Elite', monospace;

font-size:clamp(16px,2vw,26px);

line-height:1.5;
}

</style>

</head>

<body>

<!-- GOOGLE TRANSLATE -->
<div id="google_translate_element"></div>

<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement(
    {
      pageLanguage: 'en',
      autoDisplay: false
    },
    'google_translate_element'
  );
}
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<div class="frame">

<img
src="images/IMG_0001.JPG"
>

<div class="question-text">
 <div class="line">ARE YOU RATHER:</div>
</div>

</div>
 
<!-- BULB CLICK -->

<div
class="lightbulb-hitbox"
id="bulb">
</div>

<!-- CHOICES -->

<a class="choice-a" href="audatious.html">

<div class="choice-scroll">
<div class="choice-title">
<div class="line">AUDATIOUS</div>
</div>

<div class="choice-body">
<div class="line">Curious</div>
<div class="line">& Reflective</div>
<div class="line">Critical</div>
<div class="line">& Analytical Thinker</div>
</div>

<div class="choice-footer">
<span class="Somewhat">Somewhat:</span><br>
<strong>INQUIRER</strong>
</div>

</a>

<a class="choice-b" href="https://gromain000.github.io/Gromain/">

<div class="choice-scroll"> 
<div class="choice-title">
<div class="line">CREDULOUS</div>
</div>

<div class="choice-body">
<div class="line">Believes/trusts most</div>
<div class="line">subjects readily</div>
<div class="line">with prosper</div>
<div class="line">&</div>
<div class="line">With or without evidence</div>
</div>

<div class="choice-footer">
Somewhat:
<br>
<strong>NAIVE</strong>
</div>

</a>
  
</div>

<!-- POPUP -->

<div
class="popup-overlay"
id="popup">

<div
class="popup-box"
id="popupBox">

<div class="popup-title">
Clue
</div>

<div class="popup-text">
Each step beareth a weight greater than that which comes before it
</div>

</div>

</div>

<script>

const bulb =
document.getElementById("bulb");

const popup =
document.getElementById("popup");

const popupBox =
document.getElementById("popupBox");

/* OPEN */

bulb.onclick = function(){

popup.classList.add("active");

};

/* CLOSE OUTSIDE */

popup.onclick = function(e){

if(!popupBox.contains(e.target)){

popup.classList.remove("active");

}

};

</script>

</body>
</html>
